services:
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    ports:
      - '8080:80'
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
 #    PMA_ABSOLUTE_URI: https://pma.example.net/
 #    PMA_USER: user
 #    PMA_PASSWORD: userpassword
      UPLOAD_LIMIT: 300M
  # depends_on:
  #   - db
    networks:
      - default
    # - custom-network

networks:
  default:
    driver: bridge
