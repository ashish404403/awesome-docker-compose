services:
  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    restart: unless-stopped
    ports:
      - "8099:3000"
      - "222:2222"
    volumes:
 #    - ./gitea:/data
      - gitea-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__server__LOCAL_ROOT_URL=http://gitea.example.com:8099/
      - GITEA__server__START_SSH_SERVER=true
      - GITEA__server__SSH_PORT=2222   # Internal port in container
      - GITEA__server__SSH_LISTEN_PORT=2222
      - GITEA__server__SSH_DOMAIN=gitea.example.com:222
#     - GITEA__service__ENABLE_CAPTCHA=true
#     - GITEA__service__REQUIRE_CAPTCHA_FOR_LOGIN=true
#     - GITEA__service__CAPTCHA_TYPE=cfturnstile
#     - GITEA__service__CF_TURNSTILE_SECRET=""
#     - GITEA__service__CF_TURNSTILE_SITEKEY=""
#     - GITEA__service__REGISTER_MANUAL_CONFIRM=true
#     - GITEA__service__DISABLE_REGISTRATION=true
#     - GITEA__service__DEFAULT_KEEP_EMAIL_PRIVATE=true
#     - GITEA__service__DEFAULT_USER_VISIBILITY=private

#   https://docs.gitea.com/administration/config-cheat-sheet

#   git clone ssh://git@gitea.example.com:222/ashish/test.git
#   git clone http://gitea.example.com:8099/ashish/test.git

