services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:latest
    ports:
      - "8000:8000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
     #- ./data:/data
      - portainer-data:/data
    restart: always
    networks:
      - default
    # - custom-network

volumes:
  portainer-data:
    driver: local

networks:
  default:
    driver: bridge
# custom-network:
#   external: true
