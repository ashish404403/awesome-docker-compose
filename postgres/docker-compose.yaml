services:
  postgres:
    image: postgres:alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
  #   - ./postgres-data:/var/lib/postgresql/data
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    networks:
      - default
    # - custom-network

    healthcheck:
      test: ["CMD", "sh", "-c", "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h localhost --timeout=5 --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:
    driver: local

networks:
  default:
    driver: bridge
# custom-network:
#   external: true

