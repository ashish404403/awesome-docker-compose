services:
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
    # - /opt/uptime-kuma/data:/app/data
      - uptime-kuma:/app/data
    environment:
      - TZ=Asia/Kolkata
    networks:
      - default
    # - custom-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  uptime-kuma:
    driver: local

networks:
  default:
    driver: bridge
# custom-network:
#   external: true

