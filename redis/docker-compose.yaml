services:
  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: ["redis-server", "--requirepass", "MyStrongPassword123"]
    networks:
      - default
    # - custom-network

volumes:
  redis-data:
    driver: local

networks:
  default:
    driver: bridge
# custom-network:
#   external: true

