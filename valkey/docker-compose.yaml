services:
  valkey:
    image: valkey/valkey:alpine
    container_name: valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    command: ["valkey-server", "--requirepass", "MyStrongPassword123"]
    networks:
      - default
  #   - custom-network

volumes:
  valkey-data:
    driver: local

networks:
  default:
    driver: bridge
 #custom-network:
 #  external: true
